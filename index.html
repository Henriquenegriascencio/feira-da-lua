<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Feira da Lua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .cosmic-bg {
            background-color: #0d0a17;
            background-image: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(245, 158, 11, 0.08), transparent 25%);
        }
        /* Efeito de brilho atrás do card de login */
        .glow-effect {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 60%);
            z-index: 0;
            filter: blur(40px);
        }
    </style>
</head>
<body class="cosmic-bg text-slate-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Estrelas decorativas no fundo -->
    <div class="absolute top-10 left-10 w-1 h-1 bg-white rounded-full opacity-50"></div>
    <div class="absolute top-40 right-20 w-2 h-2 bg-yellow-200 rounded-full opacity-30 blur-sm"></div>
    <div class="absolute bottom-20 left-1/4 w-1.5 h-1.5 bg-white rounded-full opacity-40"></div>
    <div class="absolute bottom-40 right-1/3 w-1 h-1 bg-white rounded-full opacity-60"></div>

    <!-- Brilho central -->
    <div class="glow-effect"></div>

    <!-- Container do Login -->
    <div class="w-full max-w-md relative z-10">
        
        <!-- Logo e Boas-Vindas -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#141021] border border-yellow-500/30 shadow-[0_0_20px_rgba(234,179,8,0.3)] mb-4">
                <span class="text-3xl">🌙</span>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">FEIRA DA <span class="text-yellow-400">LUA</span></h1>
            <p class="text-sm text-slate-400 mt-2">Controle Cósmico de Feiras</p>
        </div>

        <!-- Card de Login -->
        <div class="bg-[#141021] border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-sm bg-opacity-95">
            <h2 class="text-xl font-bold text-white mb-6 text-center">Acesse sua conta</h2>

            <form action="#" method="POST" class="space-y-5">
                <!-- Campo de E-mail -->
                <div>
                    <label for="email" class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">E-mail ou Usuário</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                        </div>
                        <input type="text" id="email" name="email" required
                            class="block w-full pl-10 pr-3 py-3 border border-slate-700 rounded-xl bg-[#0d0a17] text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all sm:text-sm"
                            placeholder="seu@email.com">
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-400 mb-2 uppercase tracking-wider">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="password" name="password" required
                            class="block w-full pl-10 pr-10 py-3 border border-slate-700 rounded-xl bg-[#0d0a17] text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent transition-all sm:text-sm"
                            placeholder="••••••••">
                        
                        <!-- Botão Mostrar/Ocultar Senha -->
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-yellow-400 transition-colors">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Opções (Lembrar / Esqueci a Senha) -->
                <div class="flex items-center justify-between mt-4">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-yellow-500 focus:ring-yellow-500 border-slate-700 rounded bg-[#0d0a17]">
                        <label for="remember-me" class="ml-2 block text-xs text-slate-400 hover:text-slate-300 cursor-pointer">Lembrar de mim</label>
                    </div>
                    <div class="text-xs">
                        <a href="#" class="font-medium text-yellow-500 hover:text-yellow-400 transition-colors">Esqueceu a senha?</a>
                    </div>
                </div>

                <!-- Botão de Entrar -->
                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-[0_4px_14px_0_rgba(234,179,8,0.39)] text-sm font-bold text-[#141021] bg-yellow-500 hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#141021] focus:ring-yellow-500 transition-all transform hover:-translate-y-0.5">
                        Entrar no Sistema
                    </button>
                </div>
            </form>

            <!-- Divisor -->
            <div class="mt-8 relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-800"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="px-2 bg-[#141021] text-slate-500">Ainda não tem acesso?</span>
                </div>
            </div>

            <!-- Botão de Contato / Suporte -->
            <div class="mt-6 text-center">
                <a href="#" class="text-sm font-medium text-slate-300 hover:text-white transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    Falar com a Organização
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-xs text-slate-600">
            <p>&copy; 2026 Feira da Lua. Todos os direitos reservados.</p>
        </div>
    </div>

    <<script>
        document.addEventListener('DOMContentLoaded', () => {
          // ... (código do togglePassword permanece aqui) ...
      
          const loginForm = document.querySelector('form');
      
          loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Impede o recarregamento da página
      
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitButton = loginForm.querySelector('button[type="submit"]');
            const originalButtonText = submitButton.innerHTML;
      
            submitButton.innerHTML = 'Entrando...';
            submitButton.disabled = true;
      
            try {
              // 1. Tenta fazer o login com e-mail e senha
              const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
              });
      
              if (authError) throw authError;
      
              // 2. Busca o perfil do usuário na tabela 'profiles' para saber o 'role'
              const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', authData.user.id)
                .single();
      
              if (profileError) throw profileError;
      
              // 3. Redireciona com base no 'role'
              if (profile.role === 'admin') {
                window.location.href = 'admin.html';
              } else {
                window.location.href = 'feirante.html';
              }
      
            } catch (error) {
              console.error('Erro no login:', error.message);
              alert('Falha no login: ' + error.message);
              submitButton.innerHTML = originalButtonText;
              submitButton.disabled = false;
            }
          });
        });
      </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Substitua pelas suas credenciais reais
  const SUPABASE_URL = 'https://jpkeqklawvmunsvzjvdr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_vLcgMhZnYNBsIjkooBb8_w_53AFsVQq';

  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
</body>
</html>
